<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- Added to the home screen: launches fullscreen, with the status bar drawn over the game. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#4fa9e6" />
    <title>Tope</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        font-family: system-ui, sans-serif;
        /* Sky colour, so anything a browser bar uncovers blends in. */
        background: #4fa9e6;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      /* Edge to edge, under notches and the home indicator (viewport-fit=cover); lvh also reaches under
         collapsing browser toolbars. The HUD alone keeps to the safe area. */
      #game {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100lvh;
        display: block;
      }
      #aim {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100lvh;
        pointer-events: none;
        visibility: hidden;
      }
      #aim.active {
        visibility: visible;
      }
      #aim .band {
        stroke: #5a3417;
        stroke-width: 7;
        stroke-linecap: round;
      }
      #aim .anchor {
        fill: #fff;
        stroke: #5a3417;
        stroke-width: 4;
      }
      #aim .knob {
        fill: rgba(255, 255, 255, 0.85);
        stroke: #5a3417;
        stroke-width: 4;
      }
      #start {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(0, 0, 0, 0.35);
        color: #fff;
        text-align: center;
        padding: 16px;
      }
      #start-btn {
        font-size: 1.4rem;
        padding: 14px 28px;
        border: 0;
        border-radius: 12px;
        background: #f2c14e;
        color: #3a2100;
        font-weight: 600;
      }
      #start-msg {
        min-height: 1.2em;
        margin: 0;
      }
      #credits {
        position: absolute;
        bottom: max(10px, env(safe-area-inset-bottom));
        margin: 0;
        font-size: 0.7rem;
        opacity: 0.8;
      }
      #hud {
        position: fixed;
        left: max(12px, env(safe-area-inset-left));
        bottom: max(12px, env(safe-area-inset-bottom));
        visibility: hidden;
      }
      #attitude {
        position: relative;
        display: block;
        width: 96px;
        height: 96px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgba(10, 40, 80, 0.25);
        -webkit-tap-highlight-color: transparent;
      }
      #attitude canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Deadzone reticle: the pin inside it means "zero" (boat holds still). */
      #attitude .reticle {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 30px;
        height: 30px;
        margin: -15px 0 0 -15px;
        border: 3px solid rgba(255, 255, 255, 0.9);
        border-radius: 50%;
        box-sizing: border-box;
        pointer-events: none;
        transition: border-color 0.15s;
      }
      #attitude.zero .reticle {
        border-color: #4cd964;
      }
      /* Fireball special: bottom-right, opposite the tilt globe. A ring fills as it recharges. */
      #fireball {
        position: fixed;
        right: max(16px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom));
        width: 84px;
        height: 84px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: conic-gradient(#ff8a1c var(--charge, 360deg), rgba(10, 40, 80, 0.35) 0);
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.15s;
      }
      #fireball .core {
        position: absolute;
        inset: 9px;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, #fff3a0 0%, #ffb02e 35%, #e2401a 75%, #7a1c0c 100%);
        filter: grayscale(0.85) brightness(0.7);
        transition: filter 0.2s;
      }
      #fireball.ready .core {
        filter: none;
      }
      #fireball.armed {
        transform: scale(1.12);
        animation: fireball-glow 0.8s ease-in-out infinite alternate;
      }
      @keyframes fireball-glow {
        from {
          box-shadow: 0 0 10px 3px rgba(255, 140, 30, 0.6);
        }
        to {
          box-shadow: 0 0 26px 10px rgba(255, 90, 20, 0.9);
        }
      }
      #fireball .timer {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 1.3rem;
        font-weight: 700;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <svg id="aim" aria-hidden="true"></svg>
    <div id="start">
      <button id="start-btn">Tap to set sail</button>
      <p id="start-msg"></p>
      <p id="credits">Enemy ship by Krzysztof Gryzka (CC BY) via Poly Pizza · ships, pirates &amp; islands by Quaternius, Kenney and Polygonal Mind (CC0)</p>
    </div>
    <div id="hud">
      <button id="attitude" aria-label="Tilt indicator, tap to set zero">
        <canvas id="attitude-canvas"></canvas>
        <span class="reticle"></span>
      </button>
      <button id="fireball" aria-label="Fireball: tap to load the next shot">
        <span class="core"></span>
        <span class="timer"></span>
      </button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
